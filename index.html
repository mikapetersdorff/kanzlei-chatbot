<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanzlei Petersdorff – Assistent</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: #0f0f0d;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .glow {
    position: fixed; top: 10%; left: 50%; transform: translateX(-50%);
    width: 600px; height: 300px;
    background: radial-gradient(ellipse, rgba(201,169,110,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .chat-wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 460px;
    display: flex; flex-direction: column;
    height: 92vh; max-height: 800px;
    background: linear-gradient(160deg, #1c1c1a 0%, #161614 100%);
    border: 1px solid rgba(201,169,110,0.18);
    box-shadow: 0 24px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
    border-radius: 4px;
    overflow: hidden;
  }

  /* Header */
  .header {
    padding: 20px 24px 16px;
    background: linear-gradient(135deg, #1a1a17 0%, #141412 100%);
    border-bottom: 1px solid rgba(201,169,110,0.12);
    position: relative;
  }
  .header::before {
    content: '';
    position: absolute; top: 0; left: 24px; right: 24px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,169,110,0.4), transparent);
  }
  .header-inner { display: flex; align-items: center; gap: 14px; }
  .logo-mark {
    width: 42px; height: 42px; flex-shrink: 0;
    border: 1px solid rgba(201,169,110,0.35);
    display: flex; align-items: center; justify-content: center;
    background: rgba(201,169,110,0.06);
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 400; color: #c9a96e;
  }
  .header-title { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 500; color: #f0ece4; letter-spacing: 0.03em; }
  .header-sub { font-size: 10px; font-weight: 400; color: rgba(201,169,110,0.65); letter-spacing: 0.16em; text-transform: uppercase; margin-top: 3px; }
  .status { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.5); animation: pulse 2.5s ease-in-out infinite; }
  .status-text { font-size: 10px; color: rgba(240,236,228,0.4); letter-spacing: 0.08em; }

  /* Messages */
  .messages {
    flex: 1; overflow-y: auto;
    padding: 20px 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.2); border-radius: 2px; }

  .msg { display: flex; flex-direction: column; max-width: 88%; animation: fadeSlideUp 0.35s cubic-bezier(0.16,1,0.3,1) forwards; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .msg.user { align-self: flex-end; align-items: flex-end; }

  .msg-label { font-size: 9px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(201,169,110,0.5); margin-bottom: 5px; padding-left: 2px; }

  .bubble {
    padding: 14px 16px; font-size: 13.5px; line-height: 1.7; font-weight: 300; letter-spacing: 0.01em;
  }
  .bubble.bot {
    background: rgba(255,255,255,0.04); color: rgba(240,236,228,0.88);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 2px 12px 12px 12px;
  }
  .bubble.user {
    background: linear-gradient(135deg, rgba(201,169,110,0.18), rgba(201,169,110,0.1));
    color: #f0ece4; border: 1px solid rgba(201,169,110,0.25);
    border-radius: 12px 12px 2px 12px;
  }
  .bubble strong { font-weight: 600; color: #c9a96e; }

  /* Quick replies */
  .quick-replies { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .qr-btn {
    padding: 7px 13px; font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 400;
    letter-spacing: 0.06em; color: rgba(201,169,110,0.8);
    background: rgba(201,169,110,0.07); border: 1px solid rgba(201,169,110,0.25);
    border-radius: 20px; cursor: pointer; transition: all 0.2s ease;
  }
  .qr-btn:hover { background: rgba(201,169,110,0.15); border-color: rgba(201,169,110,0.7); color: #c9a96e; }

  /* Typing */
  .typing-bubble { display: flex; gap: 5px; padding: 14px 16px; align-items: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 2px 12px 12px 12px; }
  .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: #c9a96e; opacity: 0.7; animation: typingBounce 1.2s ease-in-out infinite; }

  /* Form */
  .form-wrap { margin-top: 14px; }
  .form-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(201,169,110,0.7); margin-bottom: 12px; }
  .form-input {
    font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 300;
    color: #f0ece4; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(201,169,110,0.25); padding: 10px 14px;
    outline: none; width: 100%; margin-bottom: 10px; border-radius: 2px;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: rgba(201,169,110,0.5); }
  .form-input::placeholder { color: rgba(240,236,228,0.3); }
  .form-submit {
    width: 100%; padding: 11px;
    background: linear-gradient(135deg, #c9a96e, #a8813d);
    color: #0f0f0d; font-family: 'Outfit', sans-serif;
    font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    border: none; cursor: pointer; border-radius: 2px;
    transition: opacity 0.2s;
  }
  .form-submit:hover { opacity: 0.9; }
  .form-success {
    margin-top: 14px; padding: 16px;
    background: rgba(201,169,110,0.1); border: 1px solid rgba(201,169,110,0.3);
    border-radius: 2px; text-align: center;
  }

  /* Input area */
  .input-area {
    padding: 14px 16px; background: rgba(0,0,0,0.2);
    display: flex; gap: 10px; align-items: flex-end;
    border-top: 1px solid transparent;
    background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)),
      linear-gradient(90deg, transparent, rgba(201,169,110,0.15), transparent);
    background-origin: border-box;
  }
  .chat-input {
    flex: 1; font-family: 'Outfit', sans-serif; font-size: 13.5px; font-weight: 300;
    color: #f0ece4; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1); padding: 11px 14px;
    resize: none; outline: none; min-height: 44px; max-height: 100px;
    line-height: 1.5; border-radius: 22px; transition: border-color 0.2s;
  }
  .chat-input:focus { border-color: rgba(201,169,110,0.5); }
  .chat-input::placeholder { color: rgba(240,236,228,0.3); }
  .send-btn {
    width: 44px; height: 44px; flex-shrink: 0;
    background: linear-gradient(135deg, #c9a96e, #a8813d);
    border: none; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(201,169,110,0.25);
    transition: all 0.2s ease;
  }
  .send-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(201,169,110,0.35); }

  .footer {
    text-align: center; padding: 8px 16px 10px; background: rgba(0,0,0,0.15);
    font-size: 9.5px; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(201,169,110,0.3);
  }

  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.6; transform:scale(0.85); } }
  @keyframes fadeSlideUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes typingBounce { 0%,60%,100% { transform:translateY(0); opacity:0.5; } 30% { transform:translateY(-5px); opacity:1; } }
</style>
</head>
<body>

<div class="glow"></div>

<div class="chat-wrap">
  <div class="header">
    <div class="header-inner">
      <div class="logo-mark">§</div>
      <div>
        <div class="header-title">Kanzlei Petersdorff</div>
        <div class="header-sub">Steuerberatung · Biebertal</div>
      </div>
    </div>
    <div class="status">
      <div class="status-dot"></div>
      <span class="status-text">Assistent online</span>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <textarea class="chat-input" id="input" placeholder="Ihre Nachricht …" rows="1"></textarea>
    <button class="send-btn" onclick="sendMessage()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M22 2L11 13" stroke="#0f0f0d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="#0f0f0d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div class="footer">Steuerberatungskanzlei Christiane Petersdorff · Biebertal</div>
</div>

<script>
let history = [];
let quickShown = true;

function addMessage(role, html, extras = {}) {
  const container = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  if (role === 'bot') {
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'Assistent';
    wrap.appendChild(label);
  }

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  bubble.innerHTML = html;
  wrap.appendChild(bubble);

  if (extras.showQuick && quickShown) {
    const qr = document.createElement('div');
    qr.className = 'quick-replies';
    ['Öffnungszeiten', 'Termin vereinbaren', 'Unsere Leistungen', 'Benötigte Dokumente'].forEach(text => {
      const btn = document.createElement('button');
      btn.className = 'qr-btn';
      btn.textContent = text;
      btn.onclick = () => { quickShown = false; qr.remove(); handleInput(text); };
      qr.appendChild(btn);
    });
    wrap.appendChild(qr);
  }

  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

function showTyping() {
  const container = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typing';
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = 'Assistent';
  wrap.appendChild(label);
  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  bubble.innerHTML = '<div class="typing-dot" style="animation-delay:0s"></div><div class="typing-dot" style="animation-delay:0.18s"></div><div class="typing-dot" style="animation-delay:0.36s"></div>';
  wrap.appendChild(bubble);
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function formatText(text) {
  return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
}

function showAppointmentForm() {
  const container = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = 'Assistent';
  wrap.appendChild(label);

  const bubble = document.createElement('div');
  bubble.className = 'bubble bot';
  bubble.innerHTML = `
    Sehr gerne helfe ich Ihnen dabei, einen Termin zu vereinbaren. Bitte füllen Sie das folgende Formular aus:
    <div class="form-wrap" id="appt-form">
      <br>
      <input class="form-input" id="f-name" placeholder="Vollständiger Name *" />
      <input class="form-input" id="f-phone" placeholder="Telefonnummer" />
      <input class="form-input" id="f-email" placeholder="E-Mail-Adresse *" />
      <input class="form-input" id="f-date" placeholder="Wunschdatum (z. B. 15.07.2026) *" />
      <select class="form-input" id="f-reason" style="appearance:none">
        <option value="">Anliegen wählen … *</option>
        <option>Einkommensteuererklärung</option>
        <option>Buchhaltung</option>
        <option>Erstberatung</option>
        <option>Sonstiges</option>
      </select>
      <textarea class="form-input" id="f-note" placeholder="Kurze Anmerkung (optional)" style="resize:none;height:70px"></textarea>
      <button class="form-submit" onclick="submitForm()">Anfrage absenden →</button>
    </div>`;
  wrap.appendChild(bubble);
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

function submitForm() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const date = document.getElementById('f-date').value.trim();
  const reason = document.getElementById('f-reason').value;
  const note = document.getElementById('f-note').value.trim();
  if (!name || !email || !date || !reason) { alert('Bitte füllen Sie alle Pflichtfelder aus.'); return; }
  const body = `Terminanfrage\n\nName: ${name}\nTelefon: ${phone}\nE-Mail: ${email}\nWunschdatum: ${date}\nAnliegen: ${reason}${note ? '\nAnmerkung: ' + note : ''}`;
  window.location.href = `mailto:c.petersdorff@stb-petersdorff.de?subject=Terminanfrage – ${encodeURIComponent(name)}&body=${encodeURIComponent(body)}`;
  document.getElementById('appt-form').innerHTML = `<div class="form-success"><div style="font-size:20px;margin-bottom:6px">✓</div><div style="font-size:13px;color:#c9a96e;font-weight:400;letter-spacing:0.05em">Anfrage gesendet</div><div style="font-size:12px;color:rgba(240,236,228,0.6);margin-top:4px">Wir melden uns in Kürze bei Ihnen.</div></div>`;
  addMessage('bot', formatText(`Vielen Dank, <strong>${name}</strong>! Ihre Anfrage für den <strong>${date}</strong> ist eingegangen. Wir freuen uns auf das Gespräch.`));
}

async function handleInput(text) {
  quickShown = false;
  addMessage('user', formatText(text));
  history.push({ role: 'user', content: text });
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    removeTyping();
    const reply = data.reply || 'Entschuldigung, bitte versuchen Sie es erneut.';
    history.push({ role: 'assistant', content: reply });

    if (reply.trim() === 'SHOW_FORM') {
      showAppointmentForm();
    } else {
      addMessage('bot', formatText(reply));
    }
  } catch {
    removeTyping();
    addMessage('bot', 'Es tut mir leid, es ist ein technischer Fehler aufgetreten. Bitte versuchen Sie es später erneut oder kontaktieren Sie uns direkt.');
  }
}

function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  handleInput(text);
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

// Welcome
window.addEventListener('load', () => {
  const container = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.style.opacity = '0';
  wrap.style.animation = 'fadeSlideUp 0.4s 0.5s ease forwards';
  wrap.innerHTML = '<div class="msg-label">Assistent</div>';
  const bubble = document.createElement('div');
  bubble.className = 'bubble bot';
  bubble.innerHTML = 'Willkommen bei der <strong>Steuerberatungskanzlei Christiane Petersdorff</strong>.<br><br>Wie kann ich Ihnen heute behilflich sein?';
  wrap.appendChild(bubble);
  const qr = document.createElement('div');
  qr.className = 'quick-replies';
  qr.style.opacity = '0';
  qr.style.animation = 'fadeSlideUp 0.4s 0.9s ease forwards';
  ['Öffnungszeiten', 'Termin vereinbaren', 'Unsere Leistungen', 'Benötigte Dokumente'].forEach(text => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = text;
    btn.onclick = () => { quickShown = false; qr.remove(); handleInput(text); };
    qr.appendChild(btn);
  });
  wrap.appendChild(qr);
  container.appendChild(wrap);
});
</script>
</body>
</html>
